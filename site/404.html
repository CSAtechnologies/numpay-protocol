<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found | NumPay</title>
<meta name="robots" content="noindex, nofollow"/>
<!-- Asset paths here are root-relative on purpose. This file is served for any
     missing URL at any depth, so a relative path like "numpay/site.css" would
     resolve against the wrong directory and the page would arrive unstyled.
     The site is served from a domain root, so a leading slash is correct. -->
<link rel="icon" type="image/png" href="/numpay/numpay-logo.png"/>
<link rel="stylesheet" href="/numpay/fonts/fonts.css"/>
<link rel="stylesheet" href="/numpay/icons/icons.css"/>
<link rel="stylesheet" href="/numpay/site.css"/>
<script src="/numpay/theme-init.js"></script>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/">
      <span class="mark"><img src="/numpay/numpay-logo.png" alt="NumPay"/></span>
      NumPay
    </a>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark theme" aria-pressed="false">
        <i class="ph-bold ph-sun sun"></i>
        <i class="ph-bold ph-moon-stars moon"></i>
      </button>
    </div>
  </div>
</header>

<main class="wrap nf">
  <div>
    <div class="code">404</div>
    <h1>That page does not exist.</h1>
    <p>The link may be out of date, or the address may have a typo in it.</p>
    <a href="/" class="btn btn-primary">Back to NumPay</a>
  </div>
</main>

<script src="/numpay/site.js" defer></script>
</body>
</html>
