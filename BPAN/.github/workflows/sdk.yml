name: SDK CI

on:
  push:
    branches: [main]
    paths: [sdk/**]
  pull_request:
    branches: [main]
    paths: [sdk/**]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        working-directory: sdk
        run: npm install

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Test
        working-directory: sdk
        run: npm test
