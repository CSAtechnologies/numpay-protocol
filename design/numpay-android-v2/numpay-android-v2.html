  const appbar = (title, back=true, extra='') => `<div class="appbar">${back?`<button class="icon-button plain" aria-label="Back">${icon('arrow-left')}</button>`:'<div></div>'}<div style="flex:1"><h2>${title}</h2></div>${extra||'<div style="width:40px"></div>'}</div>`;

  const settingsRow = (ic,title,sub,right=icon('chevron-right')) => row(`<div class="row-icon">${icon(ic)}</div>`,title,sub,right);

  function authBody(kind){

  }

      case 'success': return `<div class="center-state">${status()}<div class="state-mark good">${icon('check')}</div><h3>Payment complete</h3><p>0.42 ETH was sent to 653-8163-8718 on Base.</p><div class="review-block" style="width:100%"><div class="review-row"><span>Paid</span><strong>$1,275.42</strong></div><div class="review-row"><span>Fee</span><strong>$0.42</strong></div></div>${btn('Done')}${btn('Share receipt','secondary','share-2')}</div>`;

      case 'receive': return shell('Receive',`<div class="segmented"><button class="segment">Send</button><button class="segment active">Receive</button></div><div class="field"><div class="field-label">Network</div><div class="field-value">${coin('ETH','eth')}<span class="grow">Ethereum</span>${icon('chevron-down')}</div></div><div class="qr"></div><div class="address">0xb4fc8acd085e404e5d482b6e98e4b13666b49dc5</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${btn('Copy','secondary','copy')}${btn('Share','secondary','share-2')}</div>${notice('warn','Ethereum only','Sending another network to this address may result in loss.')}`, 'Pay');
      case 'swap': case 'bridge': return shell(s.kind==='bridge'?'Bridge':'Swap',`${s.kind==='bridge'?'<div class="network-strip"><button class="filter active">Base</button><span style="align-self:center">→</span><button class="filter">Arbitrum</button></div>':''}<div class="field"><div class="field-label">You sell${s.kind==='bridge'?' · Base':''}</div><div class="field-value">${coin('ETH','eth')}<span class="grow">ETH</span><strong>0.42</strong></div><div class="amount-meta"><span>Balance 2.408</span><span>$1,275.42</span></div></div><div style="display:grid;place-items:center;margin:-3px 0 7px"><button class="icon-button">${icon(s.kind==='bridge'?'arrow-down':'arrow-down-up')}</button></div><div class="field"><div class="field-label">You receive${s.kind==='bridge'?' · Arbitrum':''}</div><div class="field-value">${coin(s.kind==='bridge'?'ETH':'USDC',s.kind==='bridge'?'eth':'')}<span class="grow">${s.kind==='bridge'?'ETH':'USDC'}</span><strong>${s.kind==='bridge'?'0.4191':'1,273.92'}</strong></div></div>${row('<div class="row-icon">'+icon('route')+'</div>','Best route',s.kind==='bridge'?'Stargate · ~2 min':'0x · 1 hop',s.kind==='bridge'?'$1.84 fee':'$0.42 fee')}${btn(s.kind==='bridge'?'Review bridge':'Review swap')}`);
      case 'routes': return shell('Choose route',`${notice('','Quotes update automatically','Received amount includes provider and network fees.')}<div class="eyebrow">Available routes</div>${row('<div class="row-icon">'+icon('route')+'</div>','Stargate','~2 min · $1.84 fee','0.4191 ETH','Best received')}${row('<div class="row-icon">'+icon('waves')+'</div>','Across','~1 min · $2.16 fee','0.4190 ETH')}${row('<div class="row-icon">'+icon('waypoints')+'</div>','Relay','~3 min · $1.70 fee','0.4188 ETH')}`);
      case 'swapReview': return shell('Confirm bridge',`<div class="center-state" style="height:auto;padding:8px 0"><div class="state-mark">${icon('repeat-2')}</div><h3>0.42 ETH → 0.4191 ETH</h3><p>Base to Arbitrum through Stargate</p></div><div class="review-block"><div class="review-row"><span>Minimum received</span><strong>0.4169 ETH</strong></div><div class="review-row"><span>Estimated time</span><strong>~2 minutes</strong></div><div class="review-row"><span>Provider + gas</span><strong>$1.84</strong></div><div class="review-row"><span>Recipient</span><strong>0xb4fc…d9c5</strong></div></div>${btn('Confirm and bridge')}`);
      case 'bpan': return shell('BPAN',`<div class="hero-balance"><span class="wallet-name">Your payment number</span><div class="bpan-number">653-8163-8718</div><small style="color:var(--np-good)">Ready to receive</small></div><div class="quick-grid"><button class="quick primary-quick">${icon('copy')}Copy</button><button class="quick">${icon('share-2')}Share</button><button class="quick">${icon('search')}Lookup</button></div><div class="section-head"><h3>Wallet mappings</h3><button class="text-action">Edit</button></div><div>${['EVM|0xb4fc…d9c5|ETH','BTC|bc1q…k8se|Bitcoin','SOL|7ttq…3mav|Solana','SUI|0x49…082e|Sui'].map(x=>{const [a,b,c]=x.split('|');return `<div class="mapping"><div class="map-dot">${a}</div><div><strong>${c}</strong><span style="display:block">${b}</span></div><span class="check">✓</span></div>`}).join('')}</div>${notice('','One number, many chains','People can use this BPAN after choosing a mapped network.')}`, 'BPAN');
      case 'bpanRegister': return shell('Register BPAN',`<p class="row-sub" style="white-space:normal;line-height:1.5">Choose an 11-digit payment number. It will belong to this wallet on Base.</p><div class="field"><div class="field-label">BPAN number</div><div class="field-value" style="font-variant-numeric:tabular-nums">65381638718 <span style="margin-left:auto;color:var(--np-good)">Available</span></div></div><div class="review-block"><div class="review-row"><span>Registration</span><strong>0 ETH</strong></div><div class="review-row"><span>Estimated Base gas</span><strong>~$0.03</strong></div><div class="review-row"><span>Owner</span><strong>Wallet 1</strong></div></div>${notice('warn','Permanent identity','The selected number cannot be changed after registration.')} ${btn('Review registration')}`);
      case 'mapping': return shell('Wallet mappings',`<div class="field"><div class="field-label">BPAN</div><div class="field-value">653-8163-8718</div></div>${notice('','EVM address','One EVM mapping covers Ethereum, Base, Arbitrum, Optimism, and other EVM networks.')}<div class="mapping"><div class="map-dot">EVM</div><div><strong>All EVM chains</strong><span style="display:block">0xb4fc…d9c5 · This wallet</span></div><span class="check">✓</span></div>${['BTC|Bitcoin|bc1q…k8se','SOL|Solana|7ttq…3mav','SUI|Sui|0x49…082e','TRX|Tron|TNVk…w51g'].map(x=>{const [a,b,c]=x.split('|');return `<div class="mapping"><div class="map-dot">${a}</div><div><strong>${b}</strong><span style="display:block">${c}</span></div><span class="check">✓</span></div>`}).join('')}${btn('Save mapping changes')}`);
      case 'lookup': return shell('Lookup BPAN',`<div class="field"><div class="field-label">BPAN number</div><div class="field-value">653-8163-8718 <span style="margin-left:auto">${icon('search')}</span></div></div><div class="eyebrow">Verified result</div><div class="hero-balance"><span class="wallet-name">Payment identity</span><div class="bpan-number">653-8163-8718</div><div class="row-sub">Owned by 0xb4fc…d9c5</div></div>${row(coin('ETH','eth'),'EVM networks','0xb4fc…d9c5','Mapped')}${row(coin('BTC','btc'),'Bitcoin','bc1q…k8se','Mapped')}${row(coin('SOL','sol'),'Solana','7ttq…3mav','Mapped')}${btn('Pay this BPAN')}`);
      case 'finality': return shell('BPAN',`<div class="hero-balance"><span class="wallet-name">Payment number</span><div class="bpan-number">562-9736-1767</div></div>${notice('warn','Mapping is confirming','A new Optimism address was added recently. It usually becomes available within about 15 minutes.')}<div class="timeline"><div class="timeline-item"><strong>Mapping submitted</strong><span>2:04 PM · Base</span></div><div class="timeline-item pending"><strong>Waiting for finality</strong><span>Payment destination is not available yet</span></div></div>${btn('Check again','secondary','refresh-cw')}`, 'BPAN');
      case 'activity': return shell('Activity',`<div class="network-strip"><button class="filter active">All</button><button class="filter">Sent</button><button class="filter">Received</button></div><div class="eyebrow">Today</div>${row('<div class="row-icon">'+icon('arrow-up-right')+'</div>','Sent ETH','Base · Confirmed','−0.42 ETH','−$1,275.42')}${row('<div class="row-icon">'+icon('repeat-2')+'</div>','Swapped ETH','Ethereum · Confirmed','+1,273 USDC')}${row('<div class="row-icon">'+icon('arrow-down-left')+'</div>','Received SOL','Solana · Confirmed','+2.5 SOL','+$333.65')}<div class="eyebrow">Yesterday</div>${row('<div class="row-icon">'+icon('route')+'</div>','Bridged ETH','Base → Arbitrum · Pending','0.18 ETH')}${row('<div class="row-icon">'+icon('arrow-up-right')+'</div>','Sent BTC','Bitcoin · Confirmed','−0.004 BTC')}`, 'Activity');
      case 'transaction': return shell('Transaction',`<div class="center-state" style="height:auto;padding:8px 0 14px"><div class="state-mark good">${icon('check')}</div><div class="row-sub">Sent</div><h3 style="font-size:27px">0.42 ETH</h3><p>About $1,275.42</p></div><div class="timeline"><div class="timeline-item"><strong>Payment submitted</strong><span>Today, 2:02 PM</span></div><div class="timeline-item"><strong>Confirmed on Base</strong><span>Today, 2:02 PM · 4 seconds</span></div></div><div class="review-block"><div class="review-row"><span>To</span><strong>653-8163-8718<br><small class="row-sub">0x71c4…09ea</small></strong></div><div class="review-row"><span>Network fee</span><strong>0.00014 ETH</strong></div><div class="review-row"><span>Transaction</span><strong>0x8f21…6e90</strong></div></div>${btn('View on BaseScan','secondary','external-link')}`);
      case 'emptyActivity': return shell('Activity',`<div class="center-state"><div class="state-mark">${icon('clock-3')}</div><h3>No activity yet</h3><p>Payments, swaps, and bridges will appear here after you use the wallet.</p>${btn('Receive funds','secondary','arrow-down-left')}</div>`, 'Activity');
      case 'manageTokens': return shell('Manage assets',`<div class="segmented"><button class="segment active">Tokens</button><button class="segment">Networks</button></div>${btn('Add token','secondary','plus')}<div class="eyebrow">Custom tokens</div>${row(coin('ARB'),'Arbitrum','Ethereum · 0x912…004a','', '')}${row(coin('AERO'),'Aerodrome','Base · 0x940…7832')}${row(coin('BONK'),'Bonk','Solana · DezX…263')}`);
      case 'addToken': return shell('Add token',`<div class="field"><div class="field-label">Network</div><div class="field-value">${coin('B')}<span class="grow">Base</span>${icon('chevron-down')}</div></div><div class="field"><div class="field-label">Contract address</div><div class="field-value">0x9401…7832</div></div><div class="eyebrow">Detected token</div>${row(coin('AERO'),'Aerodrome','18 decimals · Verified','$0.84','You hold 122.4')}${notice('','Review before adding','Token information is read from the selected network.')}${btn('Add AERO')}`);
      case 'manageNetworks': return shell('Manage assets',`<div class="segmented"><button class="segment">Tokens</button><button class="segment active">Networks</button></div>${notice('warn','Use RPCs you trust','A custom endpoint can report incorrect balances or transaction state.')}${btn('Add network','secondary','plus')}<div class="eyebrow">Custom networks</div>${row(coin('S'),'Base Sepolia','Chain ID 84532 · ETH','')}${row(coin('L'),'Localhost','Chain ID 31337 · ETH','')}`);
      case 'addNetwork': return shell('Add network',`<div class="field"><div class="field-label">RPC URL</div><div class="field-value">https://rpc.example.com</div></div><div class="field"><div class="field-label">Network name</div><div class="field-value placeholder">e.g. Base Sepolia</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><div class="field-label">Chain ID</div><div class="field-value">84532</div></div><div class="field"><div class="field-label">Symbol</div><div class="field-value">ETH</div></div></div><div class="field"><div class="field-label">Block explorer</div><div class="field-value placeholder">https://…</div></div>${notice('good','Endpoint verified','The endpoint reports chain ID 84532.')}${btn('Save network')}`);
      case 'settings': return shell('Settings',`<div class="eyebrow">Account</div><div class="settings-list">${settingsRow('wallet','Wallets','2 accounts')}${settingsRow('shield-check','Security','PIN, biometrics, backup')}${settingsRow('plug','Connections','1 connected dApp')}</div><div class="eyebrow">App</div><div class="settings-list">${settingsRow('landmark','Manage assets','Tokens and networks')}${settingsRow('circle-dollar-sign','Display currency','USD · $')}${settingsRow('sun-moon','Appearance','System')}${settingsRow('bell','Notifications','Receive alerts on')}</div><div class="eyebrow">Support</div><div class="settings-list">${settingsRow('circle-help','Help and support','Guides and contact')}${settingsRow('info','About NumPay','Version 0.1.0')}</div>`, 'Settings',{back:false});
      case 'accounts': return shell('Wallets',`${row('<div class="avatar">W1</div>','Wallet 1','0xb4fc…d9c5','Active')}${row('<div class="avatar" style="background:var(--np-raised);color:var(--np-ink)">T</div>','Trading','0x7e21…41aa')}${btn('Add wallet','secondary','plus')}<div class="eyebrow">Wallet actions</div>${settingsRow('pencil','Rename Wallet 1','Change the local account name')}${settingsRow('trash-2','Remove Wallet 1','Requires confirmation')}`);
      case 'security': return shell('Security',`${settingsRow('lock','Auto-lock','After 15 minutes')}${settingsRow('fingerprint','Biometric unlock','Available on this device','<span style="color:var(--np-good)">On</span>')}${settingsRow('shield-check','Device integrity','No issues detected','<span style="color:var(--np-good)">Good</span>')}<div class="eyebrow">Backup</div>${settingsRow('key-round','Recovery phrase','Confirm PIN to reveal')}${settingsRow('shield-alert','Failed PIN protection','Delay after repeated attempts','<span>On</span>')}<div class="eyebrow">Immediate action</div>${btn('Lock wallet now','secondary','lock')}`);
      case 'revealSheet': return `${shell('Security',`${settingsRow('key-round','Recovery phrase','Confirm PIN to reveal')}`)}<div class="sheet-scrim"><div class="sheet"><div class="handle"></div><h3>Reveal recovery phrase</h3><p>These words control this wallet on any device. Make sure nobody can see your screen.</p><div class="pin-dots">${[1,2,3,4,5,6].map(_=>'<span class="pin-dot"></span>').join('')}</div>${btn('Continue')}${btn('Cancel','secondary')}</div></div>`;
      case 'preferences': return shell('Preferences',`${settingsRow('circle-dollar-sign','Display currency','USD · United States Dollar')}${settingsRow('sun-moon','Appearance','Follow system')}${settingsRow('bell','Receive notifications','Balance changes and confirmations','<span style="color:var(--np-good)">On</span>')}${settingsRow('accessibility','Reduced motion','Follow device setting','<span>System</span>')}${settingsRow('eye','Hide balances','Blur values on launch','<span>Off</span>')}`);
      case 'currency': return shell('Display currency',`<div class="field"><div class="field-value placeholder">${icon('search')}<span>Search currencies</span></div></div>${row('<div class="row-icon">$</div>','US Dollar','USD','✓')}${row('<div class="row-icon">€</div>','Euro','EUR')}${row('<div class="row-icon">£</div>','British Pound','GBP')}${row('<div class="row-icon">₦</div>','Nigerian Naira','NGN')}${row('<div class="row-icon">¥</div>','Japanese Yen','JPY')}`);
      case 'connections': return shell('Connections',`<div class="eyebrow">WalletConnect</div>${row('<div class="row-icon">'+icon('link')+'</div>','Uniswap','Ethereum · Wallet 1','Connected')}${row('<div class="row-icon">'+icon('link')+'</div>','OpenSea','Base · Wallet 1','Connected')}<div class="eyebrow">NumPay browser</div>${row('<div class="row-icon">A</div>','app.aave.com','Ethereum · Wallet 1','Connected')}${btn('Connect another dApp','secondary','plus')}`);
      case 'walletConnect': return shell('WalletConnect',`${notice('','Connect safely','Only approve sessions from a site you recognize.')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${btn('Scan QR','secondary','scan-line')}${btn('Paste URI','secondary','clipboard')}</div><div class="field" style="margin-top:10px"><div class="field-label">Connection URI</div><div class="field-value placeholder">wc:…</div></div>${btn('Connect')}<div class="eyebrow">Active sessions</div>${row('<div class="row-icon">U</div>','Uniswap','Ethereum · 2 permissions','Disconnect')}`);
      case 'browser': return `${status()}<div class="browser-bar"><button class="icon-button plain">${icon('arrow-left')}</button><div class="url">${icon('search')}Search or enter a dApp address</div><button class="icon-button plain">${icon('ellipsis-vertical')}</button></div><div class="screen-body"><div class="site-hero"><div class="np-mark">N</div><h3>Explore the open web</h3><p>Check the address before connecting or signing.</p></div><div class="eyebrow">Popular</div>${row('<div class="row-icon">U</div>','Uniswap','app.uniswap.org')}${row('<div class="row-icon">A</div>','Aave','app.aave.com')}${row('<div class="row-icon">O</div>','OpenSea','opensea.io')}<div class="eyebrow">Recent</div>${row('<div class="row-icon">C</div>','CoW Swap','swap.cow.fi')}</div>`;
      case 'approval': return `${status()}<div class="browser-bar"><button class="icon-button plain">${icon('arrow-left')}</button><div class="url">${icon('lock')}app.uniswap.org</div><button class="icon-button plain">${icon('ellipsis-vertical')}</button></div><div class="screen-body"><div class="site-hero"><div class="site-mark">U</div><h3>Uniswap</h3><p>app.uniswap.org · Ethereum</p></div></div><div class="sheet-scrim"><div class="sheet"><div class="handle"></div><h3>Connect to this site?</h3><p>Uniswap will be able to view the selected account and request transactions. It cannot move funds without approval.</p>${row('<div class="avatar">W1</div>','Wallet 1','0xb4fc…d9c5','Ethereum')}${btn('Connect')}${btn('Reject','secondary')}</div></div>`;
      case 'defi': return shell('DeFi',`<div class="segmented" style="grid-template-columns:repeat(3,1fr)"><button class="segment active">Earn</button><button class="segment">Lend</button><button class="segment">Stake</button></div>${notice('warn','Third-party services','Rates and protocol risks come from external providers. NumPay does not custody these positions.')}<div class="eyebrow">Earn opportunities</div>${row('<div class="row-icon">A</div>','Aave V3','Ethereum · Lending','3.8%','USDC APY')}${row('<div class="row-icon">C</div>','Compound','Base · Lending','3.5%','USDC APY')}${row('<div class="row-icon">L</div>','Lido','Ethereum · Staking','2.9%','ETH APR')}${row('<div class="row-icon">M</div>','Morpho','Base · Vault','4.1%','USDC APY')}`);
      case 'developer': return shell('Developer tools',`${notice('warn','Advanced diagnostics','These tools can create test transactions and are hidden in production.')} ${settingsRow('activity','Core status','Storage and derivation checks')}${settingsRow('flask-conical','Core spike','Test local primitives')}${settingsRow('radio-tower','Devnet transaction','Use configured test network')}`);
      case 'destructive': return `${shell('Wallets',`${row('<div class="avatar">W1</div>','Wallet 1','0xb4fc…d9c5','Active')}`)}<div class="sheet-scrim"><div class="sheet"><div class="handle"></div><h3>Remove Wallet 1?</h3><p>This removes the encrypted wallet from this device. You can restore it later only with its recovery phrase.</p>${notice('bad','This cannot be undone on this device','Make sure the recovery phrase is backed up before continuing.')}${btn('Cancel','secondary')}${btn('Remove Wallet 1','danger-btn')}</div></div>`;
      default: return shell(s.title,`<div class="center-state"><div class="state-mark">${icon('layout-template')}</div><h3>${s.title}</h3><p>${s.purpose}</p></div>`);
    }
  }

  const catalog = document.getElementById('np-catalog');
  const phone = document.getElementById('np-phone');
  const notes = document.getElementById('np-notes');
  const previewRoot = document.getElementById('npv2');
  const previewTheme = document.getElementById('np-theme');
  const previewOptions = {
    appearance: new URLSearchParams(globalThis.location?.search || '').get('theme') === 'dark' ? 'Dark' : 'Light'
  };
  let current = 0;

  function applyPreviewOptions(){
    const dark = previewOptions.appearance === 'Dark';
    previewRoot.classList.toggle('dark',dark);
    previewTheme.setAttribute('aria-pressed',String(dark));
    previewTheme.classList.toggle('is-on',dark);
    previewTheme.innerHTML=`${icon(dark?'sun':'moon')}${dark?'Light preview':'Dark preview'}`;
    if(window.lucide) window.lucide.createIcons({attrs:{width:18,height:18}});
  }

  function buildCatalog(){
    let last = '';
    catalog.innerHTML = screens.map((s,i)=>{
      const head = s.section!==last ? `<div class="np-section-label">${s.section}</div>` : '';
      last = s.section;
      return `${head}<button type="button" class="np-screen-link" data-screen="${i}"><span>${s.title}</span><span>${String(i+1).padStart(2,'0')}</span></button>`;
    }).join('');
    catalog.addEventListener('click',e=>{const b=e.target.closest('[data-screen]');if(b){current=Number(b.dataset.screen);render();}});
  }
  function render(){
    const s=screens[current];
    phone.innerHTML=renderBody(s);
    notes.innerHTML=`<div class="np-counter">${s.section} · ${current+1} of ${screens.length}</div><h2>${s.title}</h2><p class="purpose">${s.purpose}</p><div class="np-note-block"><h3>Flow</h3><div class="np-flow">${s.flow.map((x,i)=>`${i?'<b>→</b>':''}<span>${x}</span>`).join('')}</div></div><div class="np-note-block"><h3>Design decisions</h3><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div><div class="np-note-block"><h3>Shared system</h3><ul><li>Neutral canvas and surfaces carry hierarchy; violet is reserved for identity and commitment.</li><li>44dp touch targets, safe-area spacing, accessible roles, and reduced-motion behavior are required.</li><li>Network work never blocks navigation or immediate press feedback.</li></ul></div><p class="np-legend">This is the approval-stage design. Production React Native code remains unchanged until the direction and flows are accepted.</p>`;
    document.querySelectorAll('[data-screen]').forEach((b,i)=>b.classList.toggle('is-active',i===current));
    document.querySelector('[data-screen].is-active')?.scrollIntoView({block:'nearest'});
    if(window.lucide) window.lucide.createIcons({attrs:{width:18,height:18}});
  }
  document.getElementById('np-prev').addEventListener('click',()=>{current=(current-1+screens.length)%screens.length;render();});
  document.getElementById('np-next').addEventListener('click',()=>{current=(current+1)%screens.length;render();});
  previewTheme.addEventListener('click',()=>{previewOptions.appearance=previewOptions.appearance==='Dark'?'Light':'Dark';applyPreviewOptions();});
  applyPreviewOptions();
  buildCatalog(); render();
  if(globalThis.Tweak){
    const tweak = new Tweak({container:previewRoot,onChange:applyPreviewOptions});
    tweak.addSelect(previewOptions,'appearance',{label:'Appearance',options:['Light','Dark'],reference:'preview.appearance'});
  }
})();
</script>
