<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NumPay dApp connect test (P1)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 12px; margin: 4px 4px 4px 0; cursor: pointer; }
    pre { background: #111; color: #0f0; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 60px; }
    .row { margin: 10px 0; }
    h1 { font-size: 18px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>NumPay dApp connect test (P1)</h1>
  <p><small>Must be served over http/https (content scripts do not inject on file://).
  Try: <code>npx serve dapp-test</code> then open the shown localhost URL.</small></p>

  <div class="row" id="discovery">Provider: detecting...</div>

  <div class="row">
    <button onclick="run('eth_requestAccounts')">eth_requestAccounts (connect)</button>
    <button onclick="run('eth_accounts')">eth_accounts</button>
    <button onclick="run('eth_chainId')">eth_chainId</button>
    <button onclick="run('net_version')">net_version</button>
  </div>
  <div class="row">
    <button onclick="getBalance()">eth_getBalance (selected)</button>
    <button onclick="run('eth_blockNumber')">eth_blockNumber</button>
    <button onclick="run('personal_sign', ['0x68656c6c6f', selected])">personal_sign (should be unsupported)</button>
  </div>

  <pre id="out">Ready.</pre>

  <script>
    let provider = window.ethereum || null;
    let selected = null;

    // EIP-6963 discovery
    window.addEventListener("eip6963:announceProvider", (e) => {
      const { info, provider: p } = e.detail;
      document.getElementById("discovery").textContent =
        "EIP-6963 provider announced: " + info.name + " (rdns " + info.rdns + ")";
      if (info.name === "NumPay") provider = p;
    });
    window.dispatchEvent(new Event("eip6963:requestProvider"));

    if (provider) {
      document.getElementById("discovery").textContent ||= "window.ethereum present";
      provider.on && provider.on("accountsChanged", (a) => log("event accountsChanged: " + JSON.stringify(a)));
      provider.on && provider.on("chainChanged", (c) => log("event chainChanged: " + c));
      provider.on && provider.on("connect", (c) => log("event connect: " + JSON.stringify(c)));
      provider.on && provider.on("disconnect", (c) => log("event disconnect: " + JSON.stringify(c)));
    }

    function log(msg) {
      const out = document.getElementById("out");
      out.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg + "\n" + out.textContent;
    }

    async function run(method, params) {
      if (!provider) return log("No NumPay provider found.");
      try {
        const res = await provider.request({ method, params: params || [] });
        if (method === "eth_requestAccounts" || method === "eth_accounts") selected = res[0] || null;
        log(method + " -> " + JSON.stringify(res));
      } catch (e) {
        log(method + " ERROR -> " + JSON.stringify({ code: e.code, message: e.message }));
      }
    }

    async function getBalance() {
      if (!selected) return log("Connect first to get a selected account.");
      run("eth_getBalance", [selected, "latest"]);
    }
  </script>
</body>
</html>
