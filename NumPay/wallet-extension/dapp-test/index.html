<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NumPay dApp connect test (P1)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 12px; margin: 4px 4px 4px 0; cursor: pointer; }
    pre { background: #111; color: #0f0; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; min-height: 60px; }
    .row { margin: 10px 0; }
    h1 { font-size: 18px; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>NumPay dApp connect test (P1)</h1>
  <p><small>Must be served over http/https (content scripts do not inject on file://).
  Try: <code>npx serve dapp-test</code> then open the shown localhost URL.</small></p>

  <div class="row" id="discovery">Provider: detecting...</div>

  <div class="row">
    <button onclick="run('eth_requestAccounts')">eth_requestAccounts (connect)</button>
    <button onclick="run('eth_accounts')">eth_accounts</button>
    <button onclick="run('eth_chainId')">eth_chainId</button>
    <button onclick="run('net_version')">net_version</button>
  </div>
  <div class="row">
    <button onclick="getBalance()">eth_getBalance (selected)</button>
    <button onclick="run('eth_blockNumber')">eth_blockNumber</button>
  </div>
  <div class="row">
    <button onclick="signMessage()">personal_sign (text)</button>
    <button onclick="signTyped(false)">eth_signTypedData_v4 (Mail)</button>
    <button onclick="signTyped(true)">eth_signTypedData_v4 (Permit2 ⚠)</button>
    <button onclick="run('eth_sign', [selected, '0xdeadbeef'])">eth_sign (should reject)</button>
  </div>
  <div class="row">
    <button onclick="sendNative()">eth_sendTransaction (0-value self)</button>
    <button onclick="sendApprove()">eth_sendTransaction (unlimited approve ⚠)</button>
  </div>

  <pre id="out">Ready.</pre>

  <script>
    let provider = window.ethereum || null;
    let selected = null;

    // EIP-6963 discovery
    window.addEventListener("eip6963:announceProvider", (e) => {
      const { info, provider: p } = e.detail;
      document.getElementById("discovery").textContent =
        "EIP-6963 provider announced: " + info.name + " (rdns " + info.rdns + ")";
      if (info.name === "NumPay") provider = p;
    });
    window.dispatchEvent(new Event("eip6963:requestProvider"));

    if (provider) {
      document.getElementById("discovery").textContent ||= "window.ethereum present";
      provider.on && provider.on("accountsChanged", (a) => log("event accountsChanged: " + JSON.stringify(a)));
      provider.on && provider.on("chainChanged", (c) => log("event chainChanged: " + c));
      provider.on && provider.on("connect", (c) => log("event connect: " + JSON.stringify(c)));
      provider.on && provider.on("disconnect", (c) => log("event disconnect: " + JSON.stringify(c)));
    }

    function log(msg) {
      const out = document.getElementById("out");
      out.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg + "\n" + out.textContent;
    }

    async function run(method, params) {
      if (!provider) return log("No NumPay provider found.");
      try {
        const res = await provider.request({ method, params: params || [] });
        if (method === "eth_requestAccounts" || method === "eth_accounts") selected = res[0] || null;
        log(method + " -> " + JSON.stringify(res));
      } catch (e) {
        log(method + " ERROR -> " + JSON.stringify({ code: e.code, message: e.message }));
      }
    }

    async function getBalance() {
      if (!selected) return log("Connect first to get a selected account.");
      run("eth_getBalance", [selected, "latest"]);
    }

    // personal_sign: a human-readable sign-in style message. params order is
    // [message, address]; NumPay decodes the message to UTF-8 on the approval.
    function signMessage() {
      if (!selected) return log("Connect first.");
      const msg = "Sign in to NumPay test dApp\n\nNonce: " + Date.now();
      run("personal_sign", ["0x" + toHex(msg), selected]);
    }

    function toHex(s) {
      return Array.from(new TextEncoder().encode(s))
        .map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    // eth_signTypedData_v4. benign=Mail (classic EIP-712 example); otherwise a
    // Permit2-style approval that should trigger NumPay's token-approval warning.
    function signTyped(permit2) {
      if (!selected) return log("Connect first.");
      const data = permit2 ? permit2Typed(selected) : mailTyped(selected);
      run("eth_signTypedData_v4", [selected, JSON.stringify(data)]);
    }

    function mailTyped(addr) {
      return {
        types: {
          EIP712Domain: [
            { name: "name", type: "string" },
            { name: "version", type: "string" },
            { name: "chainId", type: "uint256" },
            { name: "verifyingContract", type: "address" },
          ],
          Person: [
            { name: "name", type: "string" },
            { name: "wallet", type: "address" },
          ],
          Mail: [
            { name: "from", type: "Person" },
            { name: "to", type: "Person" },
            { name: "contents", type: "string" },
          ],
        },
        primaryType: "Mail",
        domain: { name: "Ether Mail", version: "1", chainId: 1, verifyingContract: "0xCcCCccccCCCCcCCCCCCcCcCccCcCCCcCcccccccC" },
        message: {
          from: { name: "Cow", wallet: addr },
          to: { name: "Bob", wallet: "0xbBbBBBBbbBBBbbbBbbBbbbbBBbBbbbbBbBbbBBbB" },
          contents: "Hello, Bob!",
        },
      };
    }

    // A 0-value self-send: a real, broadcastable tx that spends only gas. Review
    // it on the NumPay approval, then approve (costs gas) or reject.
    function sendNative() {
      if (!selected) return log("Connect first.");
      run("eth_sendTransaction", [{ from: selected, to: selected, value: "0x0" }]);
    }

    // approve(spender, MAX_UINT256) on USDC. Should trigger NumPay's unlimited
    // token-approval warning. Intended to be REVIEWED then rejected.
    function sendApprove() {
      if (!selected) return log("Connect first.");
      const USDC = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
      const spender = "0x1111111254EEB25477B68fb85Ed929f73A960582";
      const data =
        "0x095ea7b3" +
        spender.slice(2).toLowerCase().padStart(64, "0") +
        "f".repeat(64); // MAX_UINT256
      run("eth_sendTransaction", [{ from: selected, to: USDC, value: "0x0", data }]);
    }

    function permit2Typed(addr) {
      return {
        types: {
          EIP712Domain: [
            { name: "name", type: "string" },
            { name: "chainId", type: "uint256" },
            { name: "verifyingContract", type: "address" },
          ],
          PermitDetails: [
            { name: "token", type: "address" },
            { name: "amount", type: "uint160" },
            { name: "expiration", type: "uint48" },
            { name: "nonce", type: "uint48" },
          ],
          PermitSingle: [
            { name: "details", type: "PermitDetails" },
            { name: "spender", type: "address" },
            { name: "sigDeadline", type: "uint256" },
          ],
        },
        primaryType: "PermitSingle",
        domain: { name: "Permit2", chainId: 1, verifyingContract: "0x000000000022D473030F116dDEE9F6B43aC78BA3" },
        message: {
          details: {
            token: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48",
            amount: "1461501637330902918203684832716283019655932542975",
            expiration: "1700000000",
            nonce: "0",
          },
          spender: "0x1111111254EEB25477B68fb85Ed929f73A960582",
          sigDeadline: "1700000000",
        },
      };
    }
  </script>
</body>
</html>
